openapi: 3.0.3
info:
  title: Example API
  description: Manage users.
servers:
  - url: https://api.example.com/v1
paths:
  /users/{id}:
    parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Authorization
        in: header
        schema:
          type: string
    get:
      operationId: get_user
      summary: Get a user
      description: Returns one user.
      parameters:
        - name: verbose
          in: query
          description: Include details
          schema:
            type: boolean
      responses:
        "200":
          description: ok
    put:
      operationId: update_user
      summary: Update a user
      description: Replaces the user.
      parameters:
        - name: notify
          in: query
          schema:
            type: boolean
        - name: X-Trace
          in: header
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        "200":
          description: ok
    delete:
      operationId: delete_user
      summary: Delete a user
      responses:
        "204":
          description: deleted
  /users:
    post:
      operationId: create_user
      summary: Create a user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserInput'
      responses:
        "201":
          description: created
  /health:
    get:
      summary: Health check
      responses:
        "200":
          description: ok
  /forms:
    post:
      operationId: submit_form
      summary: Submit a form
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
      responses:
        "200":
          description: ok
  /nodes:
    post:
      operationId: create_node
      summary: Create a node
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Node'
      responses:
        "200":
          description: ok
components:
  schemas:
    UserInput:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        age:
          type: integer
        tags:
          type: array
          items:
            type: string
    Node:
      type: object
      properties:
        name:
          type: string
        children:
          type: array
          items:
            $ref: '#/components/schemas/Node'
