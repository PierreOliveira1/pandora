name: Bug report
description: Something does not work as expected.
title: "[bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Remove tokens, secrets, account names and private URLs before you paste any output.
  - type: input
    id: version
    attributes:
      label: Pandora version
      description: Paste the output of `pandora --version`.
      placeholder: 1.2.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      description: Include the OS and architecture.
      placeholder: macOS 15.2 arm64
    validations:
      required: true
  - type: dropdown
    id: client
    attributes:
      label: AI client
      options:
        - Claude Code
        - Codex
        - OpenCode
        - Cursor
        - Claude Desktop
        - Terminal only
        - Other
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest sequence that shows the problem.
      placeholder: |
        1. Run `pandora ...`
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include the full error message when there is one.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: "`pandora doctor` output"
      description: Paste the output with secrets, tokens and private URLs removed. Use `pandora doctor --offline` when a live check hangs.
      render: text
    validations:
      required: false
  - type: checkboxes
    id: secrets
    attributes:
      label: Before submitting
      options:
        - label: I removed tokens, secrets and private URLs from everything I pasted.
          required: true
